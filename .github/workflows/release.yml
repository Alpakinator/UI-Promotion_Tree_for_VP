# Pushing a version tag (v27) publishes a Release with the mod zip. The zip
# always has the same name, so this link serves the newest version:
# https://github.com/Alpakinator/UI-Promotion_Tree_for_VP/releases/latest/download/UI-Promotion-Tree-for-VP.zip
# Inside is the mod folder with its version, ready to drop into MODS. The
# annotated tag's message becomes the release notes.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the zip and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          version=$(sed -n 's/.*<Mod [^>]* version="\([0-9]*\)".*/\1/p' *.modinfo | head -n 1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match the modinfo version $version" >&2
            exit 1
          fi
          git archive --format=zip --prefix="UI - Promotion Tree for VP (v $version)/" \
            -o UI-Promotion-Tree-for-VP.zip HEAD -- LUA SQL UI XML '*.modinfo'
          gh release create "$TAG" UI-Promotion-Tree-for-VP.zip --title "Version $version" --notes-from-tag
