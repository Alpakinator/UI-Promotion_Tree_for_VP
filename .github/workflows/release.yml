# Pushing a version tag (v<version>) publishes a Release with the mod zip. The zip
# always has the same name, so this link serves the newest version:
# https://github.com/Alpakinator/UI-Promotion_Tree_for_VP/releases/latest/download/UI-Promotion-Tree-for-VP.zip
# Inside is the mod folder named after the .modinfo, holding the .modinfo and the
# files it lists, ready to drop into MODS. The annotated tag's message becomes the
# release notes; scripts/tag-release makes the tag and keeps "###" headings.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag and the mod (same script as the git hooks)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua-check
          python3 scripts/checks.py tag "$TAG"
      - name: Build the zip and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          modinfo=$(python3 scripts/checks.py shipped | head -n 1)
          python3 scripts/checks.py shipped -z | xargs -0 git archive --format=zip \
            --prefix="${modinfo%.modinfo}/" -o UI-Promotion-Tree-for-VP.zip HEAD --
          gh release create "$TAG" UI-Promotion-Tree-for-VP.zip \
            --title "Version $(python3 scripts/checks.py version)" --notes-from-tag
